{% extends 'mailing/base.html' %}
{% block title %}Add your client{% endblock %}

{% block content %}
{% include 'mailing/header.html' %}
<h2> {{ title }} </h2>
<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">
                        {% if object %}
                            Update
                        {% else %}
                            Add client
                        {% endif %}
                        </button>
                        <p><a class="btn btn-success" href="{% url 'mailing:receivers_list' %}">Back to all Clients</a></p>
                        <a href="{% url 'mailing:receiver_create' %}" class="btn btn-secondary">Create new Client</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
