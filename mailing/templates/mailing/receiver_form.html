{% extends 'mailing/base.html' %}
{% block title %}Add your client{% endblock %}

{% block content %}
{% include 'mailing/header.html' %}
<h2> {{ title }} </h2>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <form class="row" enctype="multipart/form-data" method="post">
                    <div class="card">
                        <div class="card-body">
                            {% csrf_token %}
                                {{ form.as_p }}
                                    <button class="btn btn-primary" type="submit">
                                        {% if object %}
                                            Update
                                        {% else %}
                                            Add client
                                        {% endif %}
                                    </button>
                            <p><a class="btn btn-success" href="{% url 'mailing:receivers_list' %}">Back to all Clients</a></p>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
